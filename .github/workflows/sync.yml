name: sync-from-team

# 팀 저장소(code5312/Automation-Project-etch-AI)의 브랜치·태그를 이 저장소로 그대로 복사한다.
# 매시간 자동 실행 + Actions 탭에서 "Run workflow"로 수동 실행 가능.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 팀 저장소 브랜치·태그 복사
        env:
          # 팀이 워크플로 파일(.github/workflows)을 바꾸면 기본 토큰으로는 push가 막힌다.
          # 그때는 workflow 권한이 있는 토큰을 저장소 Secret "SYNC_TOKEN"으로 등록하면 된다.
          TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
          UPSTREAM: https://github.com/code5312/Automation-Project-etch-AI.git
        run: |
          set -e
          git clone --bare "$UPSTREAM" upstream
          cd upstream
          git push --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'
